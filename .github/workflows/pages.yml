name: Publish MOMON GRAND PRIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - uses: pnpm/setup@v1
        with:
          version: 11.25.0
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          PAGES_BASE_PATH: /chun-mirai-momon-kobo/
      - run: pnpm run test:game
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
